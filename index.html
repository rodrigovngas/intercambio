<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Intercambio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #f3f4f6;
            --primary: #111827; 
            --primary-hover: #374151;
            --accent: #000000; 
            --text-main: #1f2937;
            --text-sec: #6b7280;
            --border: #e5e7eb;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --radius: 16px;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        input, textarea, select { user-select: text !important; -webkit-user-select: text !important; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #ffffff, #f3f4f6);
            color: var(--text-main); margin: 0; padding: 0;
            height: 100dvh; width: 100vw; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
        }

        .container {
            background: #ffffff; width: 100%; height: 100%; max-width: 500px;
            overflow-y: auto; padding: 30px 25px 0 25px;
            display: flex; flex-direction: column; position: relative;
        }

        @media (min-width: 501px) {
            .container { 
                height: auto; max-height: 90dvh; border-radius: var(--radius); 
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
                padding-bottom: 30px; border: 1px solid rgba(0,0,0,0.02);
            }
        }

        .screen-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 20px; position: relative; }

        .btn-settings {
            position: absolute; top: 0; right: 0; 
            background: transparent; border: none; padding: 10px; cursor: pointer;
            color: #d1d5db; transition: color 0.3s; z-index: 50; width: auto; margin: 0;
        }
        .btn-settings:hover { color: var(--primary); }

        h1, h2, h3 { margin-top: 0; color: var(--primary); text-align: center; letter-spacing: -0.03em; }
        h1 { font-size: 2.2rem; font-weight: 800; }
        p { color: var(--text-sec); line-height: 1.6; margin-bottom: 25px; text-align: center; font-size: 0.95rem; }

        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-sec); margin-bottom: 6px; margin-top: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .password-wrapper { position: relative; width: 100%; }
        .btn-toggle-pass {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; padding: 8px; cursor: pointer;
            color: var(--text-sec); display: flex; align-items: center; justify-content: center;
            width: auto; margin: 0; z-index: 5;
        }

        input:not([type="checkbox"]), textarea, select {
            width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
            font-size: 1rem; background: #fff; color: var(--text-main); 
            font-family: inherit; appearance: none; outline: none;
            transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        input[type="password"] { padding-right: 45px; } 
        
        input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.05); }

        input.pin-valid { border-color: var(--success) !important; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1) !important; }

        input[type="checkbox"] {
            appearance: auto !important; -webkit-appearance: checkbox !important;
            width: 20px !important; height: 20px !important; accent-color: var(--primary);
            margin: 0 8px 0 0 !important; vertical-align: middle; cursor: pointer;
        }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 1rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem;
        }

        button {
            width: 100%; padding: 16px; border: none; border-radius: 12px; 
            font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 24px; 
            transition: transform 0.1s, opacity 0.2s; touch-action: manipulation;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        button:active { transform: scale(0.98); }

        .btn-primary, .btn-accent { 
            background: linear-gradient(135deg, #1f2937 0%, #000000 100%); color: white; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-secondary { background-color: white; border: 1px solid var(--border); color: var(--text-main); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-text { background: none; color: var(--text-sec); margin-top: 15px; font-size: 0.9em; text-decoration: underline; }
        .btn-danger-text { 
            background: none; color: var(--danger); margin-top: 30px; font-size: 0.8em; 
            border: 1px dashed var(--danger); padding: 10px; opacity: 0.8; 
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }

        .icon { width: 20px; height: 20px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-lg { width: 48px; height: 48px; stroke-width: 1.5; }
        .icon-sm { width: 16px; height: 16px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

        .add-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: flex-start; }
        .btn-add-small { width: auto; margin-top: 0; padding: 0 16px; height: 52px; background: linear-gradient(135deg, #374151 0%, #111827 100%); color: white; } 
        
        .participants-container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .name-card-admin { background: white; border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 0.95rem; }
        .child-tag { background:#eff6ff; color:#1d4ed8; font-size:0.7em; padding:2px 6px; border-radius:4px; margin-right:5px; border:1px solid #bfdbfe; font-weight: 700; }
        .btn-icon-delete { background: none; border: none; padding: 4px; color: #9ca3af; margin-top: 0; width: auto; cursor: pointer; transition: color 0.2s; }

        .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; padding-bottom: 40px; }
        .name-card-user { background: white; border: 1px solid var(--border); padding: 20px 15px; border-radius: 14px; text-align: center; font-weight: 600; cursor: pointer; position: relative; box-shadow: var(--card-shadow); transition: all 0.2s; color: var(--primary); }
        .seen-badge { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 0 2px white; }

        .info-card { background: linear-gradient(135deg, #374151 0%, #111827 100%); color: white; border-radius: 16px; padding: 30px; margin-bottom: 25px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3); text-align: center; border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
        #reveal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1f2937 0%, #000000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; cursor: pointer; transition: opacity 0.6s ease; }
        #reveal-overlay.faded { opacity: 0; pointer-events: none; }
        
        .pill { display: inline-flex; align-items: center; gap: 5px; background: #f3f4f6; color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin: 0 5px; border: 1px solid #e5e7eb; }
        .link-box { background: #f9fafb; padding: 20px; border-radius: 12px; word-break: break-all; font-family: 'SF Mono', monospace; color: var(--text-main); font-size: 0.85em; text-align: center; margin: 20px 0; border: 1px solid var(--border); }
        .wishes-list { margin: 25px 0 0 0; padding: 0; list-style: none; font-size: 1.1rem; text-align: left; display: block; width: 100%; }
        .wishes-list li { margin-bottom: 12px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.3); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: flex-end; z-index: 1000; }
        @media (min-width: 501px) { .modal-overlay { align-items: center; } }
        .modal-content { background: white; padding: 35px 30px; border-top-left-radius: 24px; border-top-right-radius: 24px; width: 100%; max-width: 500px; max-height: 85dvh; overflow-y: auto; box-shadow: 0 -20px 60px rgba(0,0,0,0.25); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @media (min-width: 501px) { .modal-content { border-radius: 24px; width: 90%; max-width: 400px; } }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .hidden { display: none !important; }

        .app-footer { margin-top: auto; padding: 25px 0; text-align: center; font-size: 0.7rem; color: #d1d5db; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .spinner { width: 24px; height: 24px; border: 3px solid rgba(17, 24, 39, 0.1); border-radius: 50%; border-top-color: var(--primary); animation: spin 0.8s linear infinite; margin: 20px auto; display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: rgba(31, 41, 55, 0.95); color: white; padding: 12px 20px; border-radius: 50px; opacity: 0; transition: all 0.3s; text-align: center; margin-bottom: 10px; }
        .toast.show { opacity: 1; transform: translateY(20px); }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <div id="screen-home" class="hidden screen-content">
        <button class="btn-settings" onclick="promptForAdmin(() => goToMasterPanel())">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <h1>Intercambio</h1>
        <p>Organiza intercambios de forma sencilla.</p>
        <button class="btn-accent" onclick="showAdminSetup()">Crear Nuevo Sorteo</button>
    </div>

    <div id="screen-admin" class="hidden screen-content">
        <h2>Configurar Evento</h2>
        <label>Título del Evento</label>
        <input type="text" id="setup-title" placeholder="Ej. Cena de Navidad">
        <label>Fecha</label>
        <div class="date-picker-row">
            <select id="setup-day"><option value="" disabled selected>Día</option></select>
            <select id="setup-month">
                <option value="" disabled selected>Mes</option>
                <option value="01">Ene</option><option value="02">Feb</option><option value="12">Dic</option>
            </select>
        </div>
        <div style="display:flex; gap:10px;">
            <div style="flex:1">
                <label>Presupuesto</label>
                <select id="setup-budget">
                    <option value="Libre">Libre</option>
                    <option value="$100">$100</option><option value="$500">$500</option>
                </select>
            </div>
            <div style="flex:1">
                <label>¿Qué se regala?</label>
                <input type="text" id="setup-gift-type" placeholder="Ej. Pijamas">
            </div>
        </div>
        <label>Participantes</label>
        <div class="add-row">
            <div style="flex:1">
                <input type="text" id="input-new-name" placeholder="Nombre...">
                <div style="margin-top:8px; display:flex; align-items:center;">
                    <input type="checkbox" id="check-is-child">
                    <label for="check-is-child" style="margin:0; text-transform:none; font-weight:500;">Dependiente</label>
                </div>
            </div>
            <button class="btn-add-small" id="btn-add-name">+</button>
        </div>
        <div id="participants-container" class="participants-container"></div>
        <button class="btn-accent" id="btn-create-event" style="margin-top:30px;">Generar Sorteo</button>
    </div>

    <div id="screen-share" class="hidden screen-content">
        <div style="text-align:center;">
            <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            <h2>¡Evento Creado!</h2>
        </div>
        <div class="link-box" id="share-link-text">...</div>
        <button class="btn-accent" onclick="copyLink()">Copiar Enlace</button>
        <button class="btn-secondary" onclick="location.reload()">Ir al inicio</button>
    </div>

    <div id="screen-login" class="hidden screen-content">
        <h2 id="event-title-display">...</h2>
        <div style="display:flex; justify-content:center; margin-bottom:30px; gap:10px;">
            <span class="pill" id="event-date-display"></span>
            <span class="pill" id="event-budget-display"></span>
        </div>
        <p>¿Quién eres? Selecciona tu nombre:</p>
        <div id="names-list" class="name-grid"></div>
    </div>

    <div id="screen-dashboard" class="hidden screen-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0;">Tu Resultado</h3>
            <small onclick="location.reload()" style="cursor:pointer; font-weight:700;">SALIR</small>
        </div>
        <div class="info-card">
            <div id="reveal-overlay" onclick="revealName()">
                <span style="color:white; font-weight:700;">TOCA PARA REVELAR</span>
            </div>
            <small style="opacity: 0.7;">Te tocó regalar a</small>
            <h1 id="target-name" style="color:white; margin: 15px 0;">...</h1>
        </div>
        <h3>Tus Opciones</h3>
        <input type="text" id="my-wish-1" placeholder="Opción 1" style="margin-bottom:10px;">
        <input type="text" id="my-wish-2" placeholder="Opción 2">
        <button class="btn-accent" id="btn-save-wishes">Guardar</button>
    </div>

    <footer class="app-footer">Development by VNGAS</footer>
</div>

<div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="modal-title">Hola</h2>
        <p id="modal-desc">Seguridad de tu cuenta</p>

        <div id="form-auth">
            <label id="label-pin">Ingresa un PIN de 6 dígitos</label> 
            <input type="tel" id="input-pin" class="pin-input" placeholder="123456" maxlength="6" inputmode="numeric" style="letter-spacing: 5px; font-weight: bold; text-align: center;">
            
            <div id="claim-children-section" class="hidden" style="margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
                <label style="margin-top:0; font-size:0.85em;">¿Gestionas a algún menor?</label>
                <div id="children-list-check"></div>
            </div>
            
            <button class="btn-accent" id="btn-auth-action" onclick="handleAuth()">Confirmar</button>
        </div>

        <div id="admin-override-box" class="hidden">
            <button class="btn-danger-text" onclick="promptForAdmin(() => adminOverride())">Resetear acceso (Admin)</button>
        </div>
        <button class="btn-text" onclick="closeModal()">Cerrar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, writeBatch, serverTimestamp, onSnapshot, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsVkuWgNhpC5cIyRem9ArT8QBNpWtSCX0",
        authDomain: "sorteo-f421d.firebaseapp.com",
        projectId: "sorteo-f421d",
        storageBucket: "sorteo-f421d.firebasestorage.app",
        messagingSenderId: "528703807084",
        appId: "1:528703807084:web:f1b84b8ebc5ec94a044249"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const MASTER_KEY = "admin123";

    let eventId = new URLSearchParams(window.location.search).get('id');
    let participantsList = [];
    let selectedUserDoc = null;

    // --- SEGURIDAD ---
    async function hashString(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // --- TOAST ---
    window.showToast = (msg) => {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div'); el.className = 'toast show'; el.innerText = msg;
        container.appendChild(el);
        setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000);
    };

    // --- AUTH LOGIC (UNIFICADA) ---
    window.prepareAuth = async (id, data) => {
        selectedUserDoc = { id, data };
        document.getElementById('input-pin').value = "";
        document.getElementById('auth-modal').classList.remove('hidden');
        document.getElementById('modal-title').innerText = `Hola, ${data.name}`;
        
        if(!data.password) {
            document.getElementById('modal-desc').innerText = "Crea un PIN de 6 dígitos para entrar.";
            document.getElementById('label-pin').innerText = "Crea tu PIN de acceso";
            // Lógica de hijos (original)
            const listDiv = document.getElementById('children-list-check');
            const section = document.getElementById('claim-children-section');
            listDiv.innerHTML = '<div class="spinner"></div>';
            const q = await getDocs(collection(db, `events/${eventId}/participants`));
            listDiv.innerHTML = ""; let found = false;
            q.forEach(ds => {
                const k = ds.data();
                if(k.isChild && ds.id !== id && !k.managedBy) {
                    found = true;
                    listDiv.innerHTML += `<label style="display:flex; align-items:center;"><input type="checkbox" class="child-claim" value="${ds.id}"> ${k.name}</label>`;
                }
            });
            found ? section.classList.remove('hidden') : section.classList.add('hidden');
        } else {
            document.getElementById('modal-desc').innerText = "Ingresa tu PIN para ver tu resultado.";
            document.getElementById('label-pin').innerText = "Tu PIN de 6 dígitos";
            document.getElementById('claim-children-section').classList.add('hidden');
            document.getElementById('admin-override-box').classList.remove('hidden');
        }
    };

    window.handleAuth = async () => {
        const pin = document.getElementById('input-pin').value;
        if(pin.length !== 6) return showToast("El PIN debe tener 6 números");
        const h = await hashString(pin);

        if(!selectedUserDoc.data.password) {
            // Registro
            const kids = Array.from(document.querySelectorAll('.child-claim:checked')).map(c => c.value);
            const batch = writeBatch(db);
            batch.update(doc(db, `events/${eventId}/participants/${selectedUserDoc.id}`), { password: h });
            kids.forEach(kidId => batch.update(doc(db, `events/${eventId}/participants/${kidId}`), { managedBy: selectedUserDoc.id }));
            await batch.commit();
            enterDashboard(selectedUserDoc.id, { ...selectedUserDoc.data, password: h });
        } else {
            // Login
            if(h === selectedUserDoc.data.password) enterDashboard(selectedUserDoc.id, selectedUserDoc.data);
            else showToast("PIN incorrecto");
        }
        closeModal();
    };

    window.closeModal = () => document.getElementById('auth-modal').classList.add('hidden');

    function enterDashboard(uid, userData) {
        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-dashboard').classList.remove('hidden');
        document.getElementById('target-name').innerText = userData.targetName;
        if(userData.revealed) document.getElementById('reveal-overlay').classList.add('faded');
    }

    window.revealName = () => {
        document.getElementById('reveal-overlay').classList.add('faded');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        updateDoc(doc(db, `events/${eventId}/participants/${selectedUserDoc.id}`), { revealed: true });
    };

    // --- CONFIG EVENTO (ORIGINAL RESTAURADA) ---
    window.onload = () => {
        const s = document.getElementById('setup-day');
        for(let i=1; i<=31; i++) s.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}</option>`;
        if(eventId) loadEvent(eventId);
        else document.getElementById('screen-home').classList.remove('hidden');
    };

    async function loadEvent(id) {
        const sn = await getDoc(doc(db, "events", id));
        if(!sn.exists()) return;
        document.getElementById('event-title-display').innerText = sn.data().title;
        document.getElementById('screen-login').classList.remove('hidden');
        onSnapshot(collection(db, `events/${id}/participants`), (qs) => {
            const list = document.getElementById('names-list'); list.innerHTML = "";
            qs.forEach(d => {
                const p = d.data(); if(p.isChild) return;
                const div = document.createElement('div'); div.className = 'name-card-user'; div.innerText = p.name;
                if(p.seen) div.innerHTML += '<div class="seen-badge"></div>';
                div.onclick = () => prepareAuth(d.id, p);
                list.appendChild(div);
            });
        });
    }

    window.showAdminSetup = () => {
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-admin').classList.remove('hidden');
    };

    document.getElementById('btn-add-name').onclick = () => {
        const name = document.getElementById('input-new-name').value;
        const child = document.getElementById('check-is-child').checked;
        if(!name) return;
        participantsList.push({ name, isChild: child });
        renderList();
        document.getElementById('input-new-name').value = "";
        document.getElementById('check-is-child').checked = false;
    };

    function renderList() {
        const c = document.getElementById('participants-container'); c.innerHTML = "";
        participantsList.forEach((p, i) => {
            c.innerHTML += `<div class="name-card-admin"><span>${p.isChild?'[D] ':''}${p.name}</span><button onclick="participantsList.splice(${i},1);renderList()">×</button></div>`;
        });
    }

    document.getElementById('btn-create-event').onclick = async () => {
        if(participantsList.length < 2) return showToast("Mínimo 2 personas");
        const evRef = await addDoc(collection(db, "events"), { title: document.getElementById('setup-title').value, createdAt: serverTimestamp() });
        const batch = writeBatch(db);
        let shuff = [...participantsList].sort(() => Math.random() - 0.5);
        for(let i=0; i<shuff.length; i++) {
            const next = shuff[(i + 1) % shuff.length];
            const pRef = doc(collection(db, `events/${evRef.id}/participants`));
            batch.set(pRef, { name: shuff[i].name, isChild: shuff[i].isChild, targetName: next.name, seen: false, revealed: false, password: null });
        }
        await batch.commit();
        eventId = evRef.id;
        document.getElementById('screen-admin').classList.add('hidden');
        document.getElementById('screen-share').classList.remove('hidden');
        document.getElementById('share-link-text').innerText = window.location.origin + window.location.pathname + "?id=" + eventId;
    };

    window.copyLink = () => { navigator.clipboard.writeText(document.getElementById('share-link-text').innerText); showToast("Copiado"); };
</script>
</body>
</html>
