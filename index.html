<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Intercambio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #f3f4f6;
            --primary: #111827; 
            --primary-hover: #374151;
            --accent: #000000; 
            --text-main: #1f2937;
            --text-sec: #6b7280;
            --border: #e5e7eb;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --radius: 16px;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        input, textarea, select { user-select: text !important; -webkit-user-select: text !important; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #ffffff, #f3f4f6);
            color: var(--text-main); margin: 0; padding: 0;
            height: 100dvh; width: 100vw; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
        }

        .container {
            background: #ffffff; width: 100%; height: 100%; max-width: 500px;
            overflow-y: auto; padding: 30px 25px 0 25px;
            display: flex; flex-direction: column; position: relative;
        }

        @media (min-width: 501px) {
            .container { 
                height: auto; max-height: 90dvh; border-radius: var(--radius); 
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
                padding-bottom: 30px; border: 1px solid rgba(0,0,0,0.02);
            }
        }

        .screen-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 20px; position: relative; }

        .btn-settings {
            position: absolute; top: 0; right: 0; 
            background: transparent; border: none; padding: 10px; cursor: pointer;
            color: #d1d5db; transition: color 0.3s; z-index: 50; width: auto; margin: 0;
        }
        .btn-settings:hover { color: var(--primary); }

        h1, h2, h3 { margin-top: 0; color: var(--primary); text-align: center; letter-spacing: -0.03em; }
        h1 { font-size: 2.2rem; font-weight: 800; }
        p { color: var(--text-sec); line-height: 1.6; margin-bottom: 25px; text-align: center; font-size: 0.95rem; }

        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-sec); margin-bottom: 6px; margin-top: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .password-wrapper { position: relative; width: 100%; }
        .btn-toggle-pass {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; padding: 8px; cursor: pointer;
            color: var(--text-sec); display: flex; align-items: center; justify-content: center;
            width: auto; margin: 0; z-index: 5;
        }

        input:not([type="checkbox"]), textarea, select {
            width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
            font-size: 1rem; background: #fff; color: var(--text-main); 
            font-family: inherit; appearance: none; outline: none;
            transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        input[type="password"] { padding-right: 45px; } 
        
        input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.05); }
        input.pin-valid { border-color: var(--success) !important; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1) !important; }

        input[type="checkbox"] {
            appearance: auto !important; -webkit-appearance: checkbox !important;
            width: 20px !important; height: 20px !important; accent-color: var(--primary);
            margin: 0 8px 0 0 !important; vertical-align: middle; cursor: pointer;
        }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 1rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem;
        }

        button {
            width: 100%; padding: 16px; border: none; border-radius: 12px; 
            font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 24px; 
            transition: transform 0.1s, opacity 0.2s; touch-action: manipulation;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        button:active { transform: scale(0.98); }

        .btn-primary, .btn-accent { 
            background: linear-gradient(135deg, #1f2937 0%, #000000 100%); color: white; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-secondary { background-color: white; border: 1px solid var(--border); color: var(--text-main); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-text { background: none; color: var(--text-sec); margin-top: 15px; font-size: 0.9em; text-decoration: underline; }
        .btn-danger-text { 
            background: none; color: var(--danger); margin-top: 30px; font-size: 0.8em; 
            border: 1px dashed var(--danger); padding: 10px; opacity: 0.8; 
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }

        .icon { width: 20px; height: 20px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-lg { width: 48px; height: 48px; stroke-width: 1.5; }
        .icon-sm { width: 16px; height: 16px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

        .participants-container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .name-card-admin {
            background: white; border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; font-weight: 500;
        }

        .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; padding-bottom: 40px; }
        .name-card-user { 
            background: white; border: 1px solid var(--border); padding: 20px 15px; border-radius: 14px; 
            text-align: center; font-weight: 600; cursor: pointer; position: relative;
            box-shadow: var(--card-shadow); transition: all 0.2s; color: var(--primary);
        }
        
        .seen-badge {
            position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; 
            background: #10b981; border-radius: 50%; box-shadow: 0 0 0 2px white;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: flex-end; z-index: 1000;
        }
        @media (min-width: 501px) { .modal-overlay { align-items: center; } }
        .modal-content {
            background: white; padding: 35px 30px; 
            border-top-left-radius: 24px; border-top-right-radius: 24px; 
            width: 100%; max-width: 500px; max-height: 85dvh; overflow-y: auto;
        }
        @media (min-width: 501px) { .modal-content { border-radius: 24px; width: 90%; max-width: 400px; } }

        .info-card { 
            background: linear-gradient(135deg, #374151 0%, #111827 100%); 
            color: white; border-radius: 16px; padding: 30px; margin-bottom: 25px; 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3); text-align: center;
            position: relative; overflow: hidden;
        }
        
        #reveal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1f2937 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer; transition: opacity 0.6s ease;
        }
        #reveal-overlay.faded { opacity: 0; pointer-events: none; }
        
        .pill { display: inline-flex; align-items: center; gap: 5px; background: #f3f4f6; color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; border: 1px solid #e5e7eb; }
        
        .wishes-list { margin: 25px 0 0 0; padding: 0; list-style: none; font-size: 1.1rem; text-align: left; }
        .wishes-list li { margin-bottom: 12px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.3); }

        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 2000; display: flex; flex-direction: column; gap: 10px;
            pointer-events: none; width: 90%; max-width: 400px;
        }
        .toast {
            background: rgba(31, 41, 55, 0.95); color: white; padding: 12px 20px;
            border-radius: 50px; font-size: 0.9rem; font-weight: 500;
            opacity: 0; transform: translateY(-20px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(17, 24, 39, 0.1);
            border-radius: 50%; border-top-color: var(--primary);
            animation: spin 0.8s linear infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <div id="screen-home" class="hidden screen-content">
        <button class="btn-settings" onclick="promptForAdmin(() => goToMasterPanel())">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <h1>Intercambio</h1>
        <p>Organiza intercambios de forma sencilla.</p>
        <button class="btn-accent" onclick="showAdminSetup()">Crear Nuevo Sorteo</button>
    </div>

    <div id="screen-admin" class="hidden screen-content">
        <h2>Configurar Evento</h2>
        <input type="text" id="setup-title" placeholder="Título del Evento">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <select id="setup-day"></select>
            <select id="setup-month">
                <option value="01">Ene</option><option value="12">Dic</option>
            </select>
        </div>
        <input type="text" id="input-new-name" placeholder="Nombre del participante" style="margin-top:15px;">
        <div style="margin-top:8px; display:flex; align-items:center;">
            <input type="checkbox" id="check-is-child"> <label for="check-is-child">Dependiente</label>
        </div>
        <button class="btn-secondary" id="btn-add-name">Añadir Nombre</button>
        <div id="participants-container" class="participants-container"></div>
        <button class="btn-accent" id="btn-create-event">Generar Sorteo</button>
    </div>

    <div id="screen-login" class="hidden screen-content">
        <h2 id="event-title-display">Cargando...</h2>
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;">
            <span class="pill" id="event-date-display"></span>
            <span class="pill" id="event-budget-display"></span>
        </div>
        <p>¿Quién eres?</p>
        <div id="names-list" class="name-grid"></div>
    </div>

    <div id="screen-dashboard" class="hidden">
        <h3 style="margin-top:20px;">Tu Resultado</h3>
        <div class="info-card">
            <div id="reveal-overlay" onclick="revealName()">
                <span style="color:white; font-weight:700;">TOCA PARA REVELAR</span>
            </div>
            <small style="opacity:0.7">Te tocó regalar a</small>
            <h1 id="target-name" style="color:white; margin:15px 0;">...</h1>
            <ul id="target-wishes-list" class="wishes-list"></ul>
        </div>
        <label>Tus deseos</label>
        <input type="text" id="my-wish-1" placeholder="Opción 1">
        <button class="btn-accent" id="btn-save-wishes">Guardar</button>
        <button id="btn-activate-biometrics" class="btn-secondary" style="display:none; margin-top:15px; border-style:dashed;">
            Activar Huella / FaceID
        </button>
        <button class="btn-text" onclick="location.reload()" style="width:100%">Cerrar Sesión</button>
    </div>
</div>

<div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="modal-title">Seguridad</h2>
        <div id="form-register" class="hidden">
            <input type="password" id="reg-pass" placeholder="Crea una contraseña">
            <input type="tel" id="reg-secret" class="pin-input" placeholder="PIN de 6 dígitos" maxlength="6">
            <button class="btn-accent" onclick="doRegister()">Registrar</button>
        </div>
        <div id="form-login" class="hidden">
            <input type="password" id="login-pass" placeholder="Tu contraseña">
            <button class="btn-accent" onclick="doLogin()">Entrar</button>
            <div id="biometric-login-zone" class="hidden">
                <p style="margin:10px 0; font-size:0.8rem;">O usa biometría</p>
                <button class="btn-secondary" onclick="loginWithBiometrics()">Usar Huella / Rostro</button>
            </div>
        </div>
        <button class="btn-text" onclick="closeModal()">Cancelar</button>
    </div>
</div>

<div id="admin-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width:320px;">
        <h3>Admin</h3>
        <input type="password" id="admin-input-pass" placeholder="Password maestro">
        <button class="btn-accent" onclick="submitAdminAuth()">Entrar</button>
        <button class="btn-text" onclick="closeAdminModal()">Cerrar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, writeBatch, serverTimestamp, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsVkuWgNhpC5cIyRem9ArT8QBNpWtSCX0",
        authDomain: "sorteo-f421d.firebaseapp.com",
        projectId: "sorteo-f421d",
        storageBucket: "sorteo-f421d.firebasestorage.app",
        messagingSenderId: "528703807084",
        appId: "1:528703807084:web:f1b84b8ebc5ec94a044249"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const MASTER_KEY = "admin123";

    let eventId = new URLSearchParams(window.location.search).get('id');
    let participantsList = [];
    let selectedUserDoc = null;
    let currentUserId = null;

    // --- MEJORAS: BIOMETRÍA Y HÁPTICOS ---
    const checkBioSupport = async () => {
        return window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    };

    window.registerBiometrics = async () => {
        try {
            const challenge = crypto.getRandomValues(new Uint8Array(32));
            const userId = Uint8Array.from(currentUserId, c => c.charCodeAt(0));
            const publicKey = {
                challenge,
                rp: { name: "Intercambio" },
                user: { id: userId, name: selectedUserDoc.data.name, displayName: selectedUserDoc.data.name },
                pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
            };
            await navigator.credentials.create({ publicKey });
            localStorage.setItem(`bio_${eventId}_${currentUserId}`, "active");
            showToast("¡Huella vinculada!");
            document.getElementById('btn-activate-biometrics').style.display = 'none';
        } catch (e) { showToast("Error al vincular"); }
    };

    window.loginWithBiometrics = async () => {
        try {
            const publicKey = { challenge: crypto.getRandomValues(new Uint8Array(32)), userVerification: "required" };
            await navigator.credentials.get({ publicKey });
            if (navigator.vibrate) navigator.vibrate(20);
            window.closeModal();
            enterDashboard(selectedUserDoc.id, selectedUserDoc.data);
        } catch (e) { showToast("Fallo biométrico"); }
    };

    // --- CORE LOGIC ---
    window.showToast = (msg) => {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = 'toast'; el.innerText = msg;
        container.appendChild(el);
        setTimeout(() => el.classList.add('show'), 10);
        setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000);
    };

    async function hashString(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.revealName = () => {
        if (navigator.vibrate) navigator.vibrate([40, 30, 80]); // Háptico premium
        document.getElementById('reveal-overlay').classList.add('faded');
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        updateDoc(doc(db, `events/${eventId}/participants/${currentUserId}`), { revealed: true });
    };

    window.onload = () => {
        const dSel = document.getElementById('setup-day');
        for(let i=1; i<=31; i++) dSel.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}</option>`;
        if (eventId) loadEventData(eventId);
        else document.getElementById('screen-home').classList.remove('hidden');
    };

    async function loadEventData(id) {
        const snap = await getDoc(doc(db, "events", id));
        if(!snap.exists()) return;
        const data = snap.data();
        document.getElementById('event-title-display').innerText = data.title;
        document.getElementById('event-date-display').innerText = data.date;
        document.getElementById('event-budget-display').innerText = data.budget;
        
        onSnapshot(collection(db, `events/${id}/participants`), (qs) => {
            const list = document.getElementById('names-list');
            if(!document.getElementById('screen-dashboard').classList.contains('hidden')) return;
            list.innerHTML = "";
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-login').classList.remove('hidden');
            qs.forEach(d => {
                const p = d.data(); if(p.isChild) return;
                const div = document.createElement('div');
                div.className = 'name-card-user';
                div.innerText = p.name;
                if(p.seen) div.innerHTML += '<div class="seen-badge"></div>';
                div.onclick = () => prepareAuth(d.id, p);
                list.appendChild(div);
            });
        });
    }

    window.prepareAuth = async (id, data) => {
        selectedUserDoc = { id, data };
        document.getElementById('modal-title').innerText = "Hola, " + data.name;
        document.getElementById('auth-modal').classList.remove('hidden');
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('form-login').classList.add('hidden');
        
        const bioZone = document.getElementById('biometric-login-zone');
        if (await checkBioSupport() && localStorage.getItem(`bio_${eventId}_${id}`)) bioZone.classList.remove('hidden');
        else bioZone.classList.add('hidden');

        if(!data.password) document.getElementById('form-register').classList.remove('hidden');
        else document.getElementById('form-login').classList.remove('hidden');
    };

    window.doRegister = async () => {
        const p = document.getElementById('reg-pass').value;
        const s = document.getElementById('reg-secret').value;
        if(p.length < 4 || s.length !== 6) return showToast("Datos inválidos");
        const hp = await hashString(p); const hs = await hashString(s);
        await updateDoc(doc(db, `events/${eventId}/participants/${selectedUserDoc.id}`), { password: hp, secretKey: hs });
        selectedUserDoc.data.password = hp;
        window.closeModal(); enterDashboard(selectedUserDoc.id, selectedUserDoc.data);
    };

    window.doLogin = async () => {
        const hp = await hashString(document.getElementById('login-pass').value);
        if(hp === selectedUserDoc.data.password) {
            window.closeModal(); enterDashboard(selectedUserDoc.id, selectedUserDoc.data);
        } else showToast("Password incorrecto");
    };

    window.enterDashboard = async (uid, userData) => {
        currentUserId = uid;
        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-dashboard').classList.remove('hidden');
        if(!userData.seen) updateDoc(doc(db, `events/${eventId}/participants/${uid}`), { seen: true });
        
        const btnBio = document.getElementById('btn-activate-biometrics');
        if (await checkBioSupport() && !localStorage.getItem(`bio_${eventId}_${uid}`)) {
            btnBio.style.display = 'block'; btnBio.onclick = window.registerBiometrics;
        }

        document.getElementById('target-name').innerText = userData.targetName;
        document.getElementById('my-wish-1').value = userData.wish1 || "";
        if(userData.revealed) document.getElementById('reveal-overlay').classList.add('faded');
        
        const tDoc = await getDoc(doc(db, `events/${eventId}/participants/${userData.targetId}`));
        const tData = tDoc.data();
        document.getElementById('target-wishes-list').innerHTML = tData.wish1 ? `<li>${tData.wish1}</li>` : "<li>Sin deseos aún</li>";
    };

    document.getElementById('btn-save-wishes').onclick = async () => {
        await updateDoc(doc(db, `events/${eventId}/participants/${currentUserId}`), { wish1: document.getElementById('my-wish-1').value });
        showToast("¡Guardado!");
    };

    window.closeModal = () => document.getElementById('auth-modal').classList.add('hidden');
    window.showAdminSetup = () => { document.getElementById('screen-home').classList.add('hidden'); document.getElementById('screen-admin').classList.remove('hidden'); };
    
    document.getElementById('btn-add-name').onclick = () => {
        const n = document.getElementById('input-new-name').value;
        if(!n) return;
        participantsList.push({ name: n, isChild: document.getElementById('check-is-child').checked });
        document.getElementById('input-new-name').value = "";
        const cont = document.getElementById('participants-container');
        cont.innerHTML += `<div class="name-card-admin">${n}</div>`;
    };

    document.getElementById('btn-create-event').onclick = async () => {
        const t = document.getElementById('setup-title').value;
        if(participantsList.length < 2) return showToast("Mínimo 2");
        const ref = await addDoc(collection(db, "events"), { title: t, date: "2025", budget: "Libre" });
        let shuff = [...participantsList].sort(() => Math.random() - 0.5);
        const batch = writeBatch(db);
        let refs = shuff.map(p => ({...p, ref: doc(collection(db, `events/${ref.id}/participants`))}));
        refs.forEach((r, i) => {
            const next = refs[(i+1)%refs.length];
            batch.set(r.ref, { name: r.name, isChild: r.isChild, targetId: next.ref.id, targetName: next.name, seen: false, revealed: false });
        });
        await batch.commit();
        window.location.href = "?id=" + ref.id;
    };
</script>
</body>
</html>
